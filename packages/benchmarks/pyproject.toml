[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "instadescribe-benchmarks"
version = "0.1.0"
description = "Tiny, readable evaluation benchmarks for InstaDescribe video-intelligence tracks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Andrii Artemenko" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Runtimes for live CLIP ONNX inference in the E002 retrieve solver. The
# package core stays dependency-free; these are imported lazily and only at
# model-load time.
clip = [
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "pillow>=10",
  "tokenizers>=0.20",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instadescribe_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
